# 旁路由面板入口：http://<旁路由IP>/
# 静态文件 = zashboard（mihomo 自动下载/升级，bind mount 原地可见，只读即可）
# 其余路径反代到同命名空间的 mihomo 控制端口
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 本地存在该文件 -> 直接返回静态资源；不存在 -> 转发给 mihomo API
    # mihomo 的 API 路径（/configs /proxies /rules /traffic ...）不会与
    # zashboard 的静态文件名冲突，因此无需逐条枚举 API 前缀
    location / {
        try_files $uri $uri/ @mihomo;
    }

    location @mihomo {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # /traffic /logs /connections /memory 是 websocket 长连接
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
